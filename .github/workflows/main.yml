# Managed by the @ghostry meta repo (.templates/workflows/generate.ts). Edit it
# there and run `bun .scripts/sync.ts`; changes made here are overwritten.
##
# Changing a package's version in a commit to main publishes it under that
# version. The GitHub release is created with an empty body; notes are written
# afterwards with the meta repo's release-notes skill.
#
# This file's name matters: each package's npm trusted publisher names
# `main.yml`, since npm checks the calling workflow, not `publish.yml`.
#
name: Build, Test, and Release

on:
  push:
    branches:
      - main

jobs:
  build-aster:
    name: Build `aster`
    uses: ./.github/workflows/build.yml
    with:
      package: aster
      path: .

  test-aster:
    name: Test `aster`
    uses: ./.github/workflows/test.yml
    needs: [build-aster]
    permissions:
      actions: read
    with:
      package: aster
      path: .
      build-run-id: ${{ needs.build-aster.outputs.run-id }}

  version-aster:
    name: Check for a release (`aster`)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
      exists: ${{ steps.read.outputs.exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read the version and look for its release
        id: read
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(jq -r .version ./package.json)"
          tag="$version"
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "tag=$tag" >> $GITHUB_OUTPUT
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            exists=true
          else
            exists=false
          fi
          echo "Release $tag already exists? $exists"
          echo "exists=$exists" >> $GITHUB_OUTPUT

  publish-aster:
    name: Publish (`aster`)
    if: ${{ needs.version-aster.outputs.exists == 'false' }}
    uses: ./.github/workflows/publish.yml
    needs:
      - build-aster
      - test-aster
      - version-aster
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    with:
      package: aster
      path: .
      version: ${{ needs.version-aster.outputs.version }}
      tag: ${{ needs.version-aster.outputs.tag }}
      release-name: ${{ needs.version-aster.outputs.version }}
      build-run-id: ${{ needs.build-aster.outputs.run-id }}
